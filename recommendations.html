<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>המלצות | מורן ברכה</title><link rel="stylesheet" href="assets/site-nav.css"><script src="assets/accessibility.js" defer></script><style>@import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;600&family=Heebo:wght@300;400;500;600;700&display=swap');*{box-sizing:border-box}:root{--bg:#fffaf7;--paper:#fffdf9;--text:#3d3937;--muted:#786f6b;--line:#eee1dc;--rose:#d88986;--rose-soft:#f6e6e3;--deep:#47443f}body{margin:0;background:linear-gradient(180deg,var(--bg),#fbf6f1);color:var(--text);font-family:'Heebo',Arial,sans-serif}.wrap{width:min(100%,1120px);margin:auto;padding:48px 28px 72px}.head{text-align:center;margin:18px auto 34px;max-width:720px}.eyebrow{color:var(--rose);font-size:14px;letter-spacing:.4px}.head h1{font-family:'Frank Ruhl Libre',serif;font-size:clamp(40px,5vw,58px);font-weight:500;margin:8px 0 10px}.head p{margin:0;color:var(--muted);font-size:17px}.carousel-shell{position:relative;max-width:820px;margin:0 auto;background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:34px;padding:24px;box-shadow:0 18px 52px rgba(70,55,45,.08)}.viewport{overflow:hidden;border-radius:24px;touch-action:pan-y}.track{display:flex;direction:ltr;transition:transform .42s ease}.slide{min-width:100%;display:flex;align-items:center;justify-content:center;padding:4px}.slide img{display:block;max-width:100%;width:auto;height:auto;max-height:72vh;object-fit:contain;border-radius:18px;box-shadow:0 10px 30px rgba(50,40,35,.08)}.controls{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:20px;direction:ltr}.arrow{width:44px;height:44px;border:1px solid #e4d7d2;border-radius:50%;background:#fff;color:var(--deep);font-size:25px;line-height:1;cursor:pointer;display:grid;place-items:center;transition:.2s}.arrow:hover{background:var(--rose-soft);transform:translateY(-1px)}.dots{display:flex;gap:8px;align-items:center}.dot{width:9px;height:9px;border:0;border-radius:50%;background:#daccc7;padding:0;cursor:pointer;transition:.2s}.dot.active{width:24px;border-radius:999px;background:var(--rose)}.counter{text-align:center;color:var(--muted);font-size:13px;margin-top:10px;direction:ltr}.hint{text-align:center;color:#9a8e89;font-size:13px;margin-top:15px}@media(max-width:700px){.wrap{padding:28px 14px 54px}.head{margin-top:8px;margin-bottom:24px}.head p{font-size:15px}.carousel-shell{padding:12px;border-radius:24px}.viewport{border-radius:18px}.slide img{border-radius:14px;max-height:68vh}.arrow{width:40px;height:40px}.controls{margin-top:14px}}</style></head><body><nav class="moran-site-nav" aria-label="ניווט ראשי"><div class="moran-nav-inner"><a class="moran-brand" href="index.html" aria-label="מורן ברכה - דף הבית"><img src="assets/moran-logo.svg" alt="מורן ברכה"></a><div class="moran-links"><a href="training.html">אימון אישי</a><a href="tzaharon.html">צהרון</a><a href="baking.html">סדנת אפייה</a><a class="active" aria-current="page" href="recommendations.html">המלצות</a></div></div></nav><main class="wrap"><section class="head"><div class="eyebrow">מילים שמחממות את הלב</div><h1>המלצות</h1><p>כמה מילים מאנשים שפגשו את מורן בדרך.</p></section><section class="carousel-shell" aria-label="קרוסלת המלצות"><div class="viewport" id="viewport"><div class="track" id="track"><figure class="slide"><img src="assets/recommendation-1.webp" alt="המלצה על מורן מתוך Instagram"></figure><figure class="slide"><img src="assets/recommendation-2.webp" alt="המלצה על מורן מתוך WhatsApp"></figure><figure class="slide"><img src="assets/recommendation-3.webp" alt="המלצה נוספת מתוך WhatsApp"></figure></div></div><div class="controls"><button class="arrow" id="prev" type="button" aria-label="המלצה קודמת">‹</button><div class="dots" id="dots" aria-label="בחירת המלצה"><button class="dot active" type="button" aria-label="המלצה 1"></button><button class="dot" type="button" aria-label="המלצה 2"></button><button class="dot" type="button" aria-label="המלצה 3"></button></div><button class="arrow" id="next" type="button" aria-label="המלצה הבאה">›</button></div><div class="counter" id="counter">1 / 3</div><div class="hint">אפשר גם להחליק ימינה או שמאלה</div></section></main><script>(function(){var track=document.getElementById('track'),dots=[].slice.call(document.querySelectorAll('.dot')),counter=document.getElementById('counter'),viewport=document.getElementById('viewport'),i=0,total=dots.length,startX=null;function show(n){i=(n+total)%total;track.style.transform='translateX('+(-i*100)+'%)';dots.forEach(function(d,j){d.classList.toggle('active',j===i);d.setAttribute('aria-current',j===i?'true':'false')});counter.textContent=(i+1)+' / '+total}document.getElementById('prev').onclick=function(){show(i-1)};document.getElementById('next').onclick=function(){show(i+1)};dots.forEach(function(d,j){d.onclick=function(){show(j)}});viewport.addEventListener('touchstart',function(e){startX=e.touches[0].clientX},{passive:true});viewport.addEventListener('touchend',function(e){if(startX===null)return;var dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>45)show(i+(dx<0?1:-1));startX=null},{passive:true});document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft')show(i+1);if(e.key==='ArrowRight')show(i-1)});show(0)})();</script></body></html>
